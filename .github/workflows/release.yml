name: Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  test:
    name: Run Tests Before Release
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: keeltrader
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: keeltrader/apps/web/package-lock.json

      - name: Install Web Dependencies
        run: npm ci
        working-directory: keeltrader/apps/web

      - name: Run Web Checks
        run: |
          make check-security-defaults
          make check-web
          make audit-web

      - name: Run API Checks
        run: |
          make check-security-defaults
          make check-api
          make audit-api

  release:
    name: Create Release
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
