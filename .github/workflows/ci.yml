name: CI

on:
  pull_request:
    branches: [main, develop, v2]
  push:
    branches: [main, develop, v2]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web (lint + type-check + test + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: keeltrader
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: keeltrader/apps/web/package-lock.json
      - run: npm ci
        working-directory: keeltrader/apps/web
      - run: make check-security-defaults
      - run: make audit-root
      - run: make check-web
      - run: make audit-web
      - run: npm run build
        working-directory: keeltrader/apps/web
      - name: Upload coverage
        if: always()
        uses: codecov/codecov-action@v3
        with:
          files: ./keeltrader/apps/web/coverage/lcov.info
          flags: frontend
          fail_ci_if_error: false

  api:
    name: API (Docker pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: keeltrader
    steps:
      - uses: actions/checkout@v4
      - run: make check-security-defaults
      - run: make check-api
      - run: make audit-api
