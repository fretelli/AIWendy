name: CI

permissions:
  contents: read

on:
  pull_request:
    branches: [v2]
  push:
    branches: [v2]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  governance:
    name: Repository governance
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: keeltrader
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: make audit-root

  web:
    name: Web (lint + type-check + test + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: keeltrader
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: keeltrader/apps/web/package-lock.json
      - run: npm ci
        working-directory: keeltrader/apps/web
      - run: make check-security-defaults
      - run: make audit-root
      - run: make check-web
      - run: make audit-web
      - run: npm run build
        working-directory: keeltrader/apps/web
      - name: Upload coverage
        if: always()
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: ./keeltrader/apps/web/coverage/lcov.info
          flags: frontend
          fail_ci_if_error: false

  api:
    name: API (Docker pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: keeltrader
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: make check-security-defaults
      - run: make check-api-static
      - run: make check-api
      - run: make audit-api
