name: CI

permissions:
  contents: read

on:
  pull_request:
    branches: [v2]
  push:
    branches: [v2]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  governance:
    name: Repository governance
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: keeltrader
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: make audit-root

  web:
    name: Web (lint + type-check + test + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: keeltrader
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: keeltrader/apps/web/package-lock.json
      - run: npm ci
        working-directory: keeltrader/apps/web
      - run: make check-security-defaults
      - run: make audit-root
      - run: make check-web
      - run: make audit-web
      - run: npm run build
        working-directory: keeltrader/apps/web
      - name: Upload coverage
        if: always()
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5
        with:
          files: ./keeltrader/apps/web/coverage/lcov.info
          flags: frontend
          fail_ci_if_error: false

  api:
    name: API (Docker pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: keeltrader
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: make check-security-defaults
      - run: make check-api-static
      - run: make check-api
      - run: make audit-api
