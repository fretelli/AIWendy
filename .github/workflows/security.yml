name: Security

on:
  push:
    branches: [v2]
  pull_request:
    branches: [v2]
  schedule:
    - cron: "23 3 * * 2"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
        with:
          fail-on-severity: high

  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      security-events: write
      packages: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: github/codeql-action/init@4187e74d05793876e9989daffde9c3e66b4acd07 # v3
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - uses: github/codeql-action/analyze@4187e74d05793876e9989daffde9c3e66b4acd07 # v3
        with:
          category: /language:${{ matrix.language }}
          output: sarif-results
          upload: true
      - name: Reject medium-or-higher CodeQL findings
        run: |
          jq -e '
            [
              .runs[]
              | (
                  (.tool.driver.rules // [])
                  | map({key: .id, value: ((.properties["security-severity"] // "0") | tonumber)})
                  | from_entries
                ) as $severity
              | .results[]?
              | select(($severity[.ruleId] // 0) >= 6.0)
            ]
            | length == 0
          ' sarif-results/*.sarif

  security-gate:
    name: Security gate
    if: always()
    needs: [dependency-review, codeql]
    runs-on: ubuntu-latest
    steps:
      - name: Require successful security jobs
        env:
          DEPENDENCY_REVIEW_RESULT: ${{ needs.dependency-review.result }}
          CODEQL_RESULT: ${{ needs.codeql.result }}
        run: |
          if [[ "$CODEQL_RESULT" != "success" ]]; then
            echo "CodeQL result: $CODEQL_RESULT" >&2
            exit 1
          fi
          if [[ "$DEPENDENCY_REVIEW_RESULT" != "success" && "$DEPENDENCY_REVIEW_RESULT" != "skipped" ]]; then
            echo "Dependency review result: $DEPENDENCY_REVIEW_RESULT" >&2
            exit 1
          fi
