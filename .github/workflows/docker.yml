name: Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: SemVer release tag, for example v0.8.9
        required: true
        type: string
      release_sha:
        description: Exact 40-character v2 commit SHA to release
        required: true
        type: string

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: ghcr.io/fretelli/keeltrader
  RELEASE_TAG: ${{ inputs.release_tag }}

jobs:
  authorize:
    name: Authorize protected release
    runs-on: ubuntu-latest
    environment: release
    permissions:
      checks: read
      contents: read
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          ref: v2
      - name: Validate release identity
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ inputs.release_sha }}
          WORKFLOW_REF: ${{ github.ref }}
          WORKFLOW_SHA: ${{ github.sha }}
        run: |
          set -Eeuo pipefail
          die() { printf 'release identity error: %s\n' "$*" >&2; exit 1; }

          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] ||
            die "release_tag must match vMAJOR.MINOR.PATCH"
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]] ||
            die "release_sha must be a full lowercase Git SHA"
          [[ "$WORKFLOW_REF" == "refs/heads/v2" ]] ||
            die "workflow must be dispatched from v2"

          git fetch --force origin refs/heads/v2:refs/remotes/origin/v2
          current_v2="$(git rev-parse refs/remotes/origin/v2)"
          [[ "$RELEASE_SHA" == "$WORKFLOW_SHA" ]] ||
            die "release_sha does not match the dispatched workflow revision"
          [[ "$RELEASE_SHA" == "$current_v2" ]] ||
            die "release_sha is not the current protected v2 head"

          verified="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${RELEASE_SHA}" --jq '.commit.verification.verified')"
          [[ "$verified" == "true" ]] ||
            die "release commit is not verified by GitHub"

          check_runs="$(gh api -H 'Accept: application/vnd.github+json' "repos/${GITHUB_REPOSITORY}/commits/${RELEASE_SHA}/check-runs?per_page=100")"
          required_checks=(
            "Repository governance"
            "Web (lint + type-check + test + build)"
            "API (Docker pytest)"
            "Security gate"
            "Self-host gate"
          )
          for check_name in "${required_checks[@]}"; do
            conclusion="$(jq -r --arg name "$check_name" '[.check_runs[] | select(.name == $name)] |
               sort_by(.completed_at) | last | .conclusion // ""' <<<"$check_runs")"
            [[ "$conclusion" == "success" ]] ||
              die "required check is not successful: $check_name"
          done

          version="${RELEASE_TAG#v}"
          grep -Eq "^## ${version} - [0-9]{4}-[0-9]{2}-[0-9]{2}$" CHANGELOG.md ||
            die "CHANGELOG.md does not contain the release heading"

          if git ls-remote --exit-code --tags origin "refs/tags/${RELEASE_TAG}" >/dev/null 2>&1; then
            git fetch --force origin "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
            tag_sha="$(git rev-list -n 1 "$RELEASE_TAG")"
            [[ "$tag_sha" == "$RELEASE_SHA" ]] ||
              die "existing release tag points to another commit"
            if gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" >/dev/null 2>&1; then
              die "release already exists"
            fi
          fi

          printf 'sha=%s\n' "$RELEASE_SHA" >> "$GITHUB_OUTPUT"

  test:
    name: Release tests
    needs: authorize
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: keeltrader
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.authorize.outputs.source_sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: keeltrader/apps/web/package-lock.json
      - run: npm install --global npm@11.6.4
      - run: npm ci
        working-directory: keeltrader/apps/web
      - run: make check-security-defaults audit-root check-web audit-web check-api-static check-api

  images:
    name: Publish ${{ matrix.image }} image
    needs: [authorize, test]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      attestations: write
      contents: read
      id-token: write
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: api
            context: ./keeltrader
            dockerfile: ./keeltrader/apps/api/Dockerfile
            build_args: |
              PIP_INDEX_URL=https://pypi.org/simple/
          - image: web
            context: ./keeltrader/apps/web
            dockerfile: ./keeltrader/apps/web/Dockerfile
            build_args: |
              NPM_CONFIG_REGISTRY=https://registry.npmjs.org/
              NEXT_PUBLIC_API_URL=http://api:8000
              NEXT_PUBLIC_AUTH_REQUIRED=1
              NEXT_PUBLIC_SITE_URL=http://localhost:3000
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.authorize.outputs.source_sha }}
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.IMAGE_NAMESPACE }}/${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}},value=${{ env.RELEASE_TAG }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.RELEASE_TAG }}
      - name: Build and push
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          build-args: ${{ matrix.build_args }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            ${{ steps.meta.outputs.labels }}
            org.opencontainers.image.revision=${{ needs.authorize.outputs.source_sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
          provenance: mode=max
          sbom: true
      - name: Attest image provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-name: ${{ env.IMAGE_NAMESPACE }}/${{ matrix.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - name: Install Cosign
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3
      - name: Sign image digest
        env:
          IMAGE: ${{ env.IMAGE_NAMESPACE }}/${{ matrix.image }}@${{ steps.build.outputs.digest }}
        run: cosign sign --yes "$IMAGE"
      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: ${{ env.IMAGE_NAMESPACE }}/${{ matrix.image }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: keeltrader-${{ matrix.image }}-${{ env.RELEASE_TAG }}.spdx.json
          upload-artifact: false
      - name: Save image metadata
        run: |
          printf '%s\n' '${{ steps.build.outputs.digest }}' > keeltrader-${{ matrix.image }}-${RELEASE_TAG}.digest
          sha256sum keeltrader-${{ matrix.image }}-${RELEASE_TAG}.spdx.json > keeltrader-${{ matrix.image }}-${RELEASE_TAG}.spdx.json.sha256
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-${{ matrix.image }}
          path: |
            keeltrader-${{ matrix.image }}-${{ env.RELEASE_TAG }}.digest
            keeltrader-${{ matrix.image }}-${{ env.RELEASE_TAG }}.spdx.json
            keeltrader-${{ matrix.image }}-${{ env.RELEASE_TAG }}.spdx.json.sha256
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: [authorize, images]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: release-*
          merge-multiple: true
          path: release-assets
      - name: Create checksums
        working-directory: release-assets
        run: sha256sum *.digest *.spdx.json > SHA256SUMS
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ needs.authorize.outputs.source_sha }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: release-assets/*
