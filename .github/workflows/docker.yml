name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: ghcr.io/fretelli/keeltrader

jobs:
  test:
    name: Release tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: keeltrader
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: keeltrader/apps/web/package-lock.json
      - run: npm ci
        working-directory: keeltrader/apps/web
      - run: make check-security-defaults audit-root check-web check-api-static check-api

  images:
    name: Publish ${{ matrix.image }} image
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: api
            context: ./keeltrader
            dockerfile: ./keeltrader/apps/api/Dockerfile
            build_args: |
              PIP_INDEX_URL=https://pypi.org/simple/
          - image: web
            context: ./keeltrader/apps/web
            dockerfile: ./keeltrader/apps/web/Dockerfile
            build_args: |
              NPM_CONFIG_REGISTRY=https://registry.npmjs.org/
              NEXT_PUBLIC_API_URL=http://api:8000
              NEXT_PUBLIC_AUTH_REQUIRED=1
              NEXT_PUBLIC_SITE_URL=http://localhost:3000
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4.5.1
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE_NAMESPACE }}/${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
      - name: Build and push
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          build-args: ${{ matrix.build_args }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
          provenance: mode=max
          sbom: true
      - name: Attest image provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-name: ${{ env.IMAGE_NAMESPACE }}/${{ matrix.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign image digest
        env:
          IMAGE: ${{ env.IMAGE_NAMESPACE }}/${{ matrix.image }}@${{ steps.build.outputs.digest }}
        run: cosign sign --yes "$IMAGE"
      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: ${{ env.IMAGE_NAMESPACE }}/${{ matrix.image }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: keeltrader-${{ matrix.image }}-${{ github.ref_name }}.spdx.json
          upload-artifact: false
      - name: Save image metadata
        run: |
          printf '%s\n' '${{ steps.build.outputs.digest }}' > keeltrader-${{ matrix.image }}-${{ github.ref_name }}.digest
          sha256sum keeltrader-${{ matrix.image }}-${{ github.ref_name }}.spdx.json > keeltrader-${{ matrix.image }}-${{ github.ref_name }}.spdx.json.sha256
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ matrix.image }}
          path: |
            keeltrader-${{ matrix.image }}-${{ github.ref_name }}.digest
            keeltrader-${{ matrix.image }}-${{ github.ref_name }}.spdx.json
            keeltrader-${{ matrix.image }}-${{ github.ref_name }}.spdx.json.sha256
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: images
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          merge-multiple: true
          path: release-assets
      - name: Create checksums
        working-directory: release-assets
        run: sha256sum *.digest *.spdx.json > SHA256SUMS
      - uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: release-assets/*
