services:
  postgres:
    image: pgvector/pgvector:pg15
    restart: unless-stopped
    environment:
      POSTGRES_DB: keeltrader
      POSTGRES_USER: keeltrader
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - selfhost_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keeltrader -d keeltrader"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.2-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - selfhost_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple/}
    restart: unless-stopped
    ports:
      - "${KEELTRADER_API_BIND:-127.0.0.1}:8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://keeltrader:${POSTGRES_PASSWORD}@postgres:5432/keeltrader
      DATABASE_POOL_SIZE: 8
      DATABASE_MAX_OVERFLOW: 2
      DATABASE_APPLICATION_NAME: keeltrader-api
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?set ENCRYPTION_KEY in .env}
      AGENT_MANAGED_PROVIDER: ${AGENT_MANAGED_PROVIDER:-openai}
      AGENT_MANAGED_MODEL: ${AGENT_MANAGED_MODEL:-}
      AGENT_MANAGED_BASE_URL: ${AGENT_MANAGED_BASE_URL:-}
      AGENT_MANAGED_API_KEY: ${AGENT_MANAGED_API_KEY:-}
      DEPLOYMENT_MODE: self-hosted
      ENVIRONMENT: production
      KEELTRADER_AUTH_REQUIRED: ${KEELTRADER_AUTH_REQUIRED:-0}
      KEELTRADER_BIND_HOST: 0.0.0.0
      KEELTRADER_EXPOSURE_HOST: ${KEELTRADER_API_BIND:-127.0.0.1}
      KEELTRADER_WEB_EXPOSURE_HOST: ${KEELTRADER_WEB_BIND:-127.0.0.1}
      KEELTRADER_RUN_MIGRATIONS: ${KEELTRADER_RUN_MIGRATIONS:-1}
      REPORT_KB_URL: ${REPORT_KB_URL:-}
      REPORT_KB_SERVICE_KEY: ${REPORT_KB_SERVICE_KEY:-}
      TUSHARE_DATABASE_URL: ${TUSHARE_DATABASE_URL:-}
      RESEARCH_CLOUD_ENABLED: ${RESEARCH_CLOUD_ENABLED:-0}
      RESEARCH_CLOUD_BASE_URL: ${RESEARCH_CLOUD_BASE_URL:-}
      RESEARCH_CLOUD_TIMEOUT_SECONDS: ${RESEARCH_CLOUD_TIMEOUT_SECONDS:-12}
      CORS_ORIGINS: ${CORS_ORIGINS:-["http://localhost:3000"]}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - selfhost_uploads:/app/uploads

  agent-platform-worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple/}
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:noexec,size=50M
    environment:
      DATABASE_URL: postgresql+asyncpg://keeltrader:${POSTGRES_PASSWORD}@postgres:5432/keeltrader
      DATABASE_POOL_SIZE: 4
      DATABASE_MAX_OVERFLOW: 1
      DATABASE_APPLICATION_NAME: keeltrader-agent-worker
      REDIS_URL: redis://redis:6379/0
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?set ENCRYPTION_KEY in .env}
      AGENT_MANAGED_PROVIDER: ${AGENT_MANAGED_PROVIDER:-openai}
      AGENT_MANAGED_MODEL: ${AGENT_MANAGED_MODEL:-}
      AGENT_MANAGED_BASE_URL: ${AGENT_MANAGED_BASE_URL:-}
      AGENT_MANAGED_API_KEY: ${AGENT_MANAGED_API_KEY:-}
      REPORT_KB_URL: ${REPORT_KB_URL:-}
      REPORT_KB_SERVICE_KEY: ${REPORT_KB_SERVICE_KEY:-}
      TUSHARE_DATABASE_URL: ${TUSHARE_DATABASE_URL:-}
      DEPLOYMENT_MODE: self-hosted
      ENVIRONMENT: production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: python tasks/agent_platform_worker.py

  opportunity-worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple/}
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:noexec,size=50M
    environment:
      DATABASE_URL: postgresql+asyncpg://keeltrader:${POSTGRES_PASSWORD}@postgres:5432/keeltrader
      DATABASE_POOL_SIZE: 3
      DATABASE_MAX_OVERFLOW: 1
      DATABASE_APPLICATION_NAME: keeltrader-opportunity-worker
      REDIS_URL: redis://redis:6379/0
      TUSHARE_DATABASE_URL: ${TUSHARE_DATABASE_URL:-}
      OPPORTUNITY_REFRESH_SECONDS: ${OPPORTUNITY_REFRESH_SECONDS:-300}
      DEPLOYMENT_MODE: self-hosted
      ENVIRONMENT: production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: python tasks/opportunity_worker.py

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      args:
        NPM_CONFIG_REGISTRY: ${NPM_CONFIG_REGISTRY:-https://registry.npmjs.org/}
        NEXT_PUBLIC_API_URL: http://api:8000
        NEXT_PUBLIC_AUTH_REQUIRED: ${KEELTRADER_AUTH_REQUIRED:-0}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
    restart: unless-stopped
    ports:
      - "${KEELTRADER_WEB_BIND:-127.0.0.1}:3000:3000"
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: http://api:8000
      NEXT_PUBLIC_AUTH_REQUIRED: ${KEELTRADER_AUTH_REQUIRED:-0}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?set NEXTAUTH_SECRET in .env}
    depends_on:
      api:
        condition: service_started

volumes:
  selfhost_postgres:
  selfhost_redis:
  selfhost_uploads:
