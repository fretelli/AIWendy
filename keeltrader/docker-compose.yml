# KeelTrader v2 — AI Native Trading Assistant
# Deployment: self-hosted server
# DB: NAS PostgreSQL keeltrader (FRP 5433) | Redis: local shared services-redis
#
# Default: docker compose up -d → API, Web, and Agent Platform worker

services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://mirrors.aliyun.com/pypi/simple/}
    image: keeltrader-api:latest
    container_name: keeltrader-api
    restart: unless-stopped
    mem_limit: 512m
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:noexec,size=100M
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - TUSHARE_DATABASE_URL=${TUSHARE_DATABASE_URL}
      - REPORT_KB_URL=${REPORT_KB_URL}
      - REPORT_KB_SERVICE_KEY=${REPORT_KB_SERVICE_KEY}
      - REDIS_URL=${REDIS_URL}
      - JWT_SECRET=${JWT_SECRET}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - AGENT_MANAGED_PROVIDER=${AGENT_MANAGED_PROVIDER:-openai}
      - AGENT_MANAGED_MODEL=${AGENT_MANAGED_MODEL:-}
      - AGENT_MANAGED_BASE_URL=${AGENT_MANAGED_BASE_URL:-}
      - AGENT_MANAGED_API_KEY=${AGENT_MANAGED_API_KEY:-}
      - KEELTRADER_AUTH_REQUIRED=${KEELTRADER_AUTH_REQUIRED:-1}
      - KEELTRADER_PASSWORD_RESET_ENABLED=${KEELTRADER_PASSWORD_RESET_ENABLED:-0}
      - KEELTRADER_AUTO_INIT_DB=${KEELTRADER_AUTO_INIT_DB:-0}
      - KEELTRADER_AUTO_INIT_TEST_USERS=${KEELTRADER_AUTO_INIT_TEST_USERS:-0}
      - KEELTRADER_RELOAD=${KEELTRADER_RELOAD:-0}
      - CORS_ORIGINS=${CORS_ORIGINS}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - ENVIRONMENT=production
      - DATABASE_POOL_SIZE=8
      - DATABASE_MAX_OVERFLOW=2
      - DATABASE_APPLICATION_NAME=keeltrader-api
    volumes:
      - uploads_data:/app/uploads
    labels:
      - "traefik.enable=false"
    command: sh scripts/docker_start.sh

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      args:
        NPM_CONFIG_REGISTRY: ${NPM_CONFIG_REGISTRY:-https://registry.npmmirror.com/}
        NEXT_PUBLIC_API_URL: http://api:8000
        NEXT_PUBLIC_AUTH_REQUIRED: "1"
        NEXT_PUBLIC_SITE_URL: https://keeltrader.joyeeassets.com
    container_name: keeltrader-web
    restart: unless-stopped
    mem_limit: 256m
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:noexec,size=50M
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=http://api:8000
      - NEXT_PUBLIC_AUTH_REQUIRED=1
      - NEXT_PUBLIC_SITE_URL=https://keeltrader.joyeeassets.com
      - NEXTAUTH_URL=${NEXTAUTH_URL}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
    depends_on:
      api:
        condition: service_started
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.keeltrader-web.rule=Host(`keeltrader.joyeeassets.com`)"
      - "traefik.http.routers.keeltrader-web.entrypoints=websecure"
      - "traefik.http.routers.keeltrader-web.tls.certresolver=letsencrypt"
      - "traefik.http.services.keeltrader-web.loadbalancer.server.port=3000"
      # Next.js API proxy route must go to web, not API
      - "traefik.http.routers.keeltrader-proxy.rule=Host(`keeltrader.joyeeassets.com`) && PathPrefix(`/api/proxy`)"
      - "traefik.http.routers.keeltrader-proxy.entrypoints=websecure"
      - "traefik.http.routers.keeltrader-proxy.tls.certresolver=letsencrypt"
      - "traefik.http.routers.keeltrader-proxy.service=keeltrader-web"

  agent-platform-worker:
    image: keeltrader-api:latest
    container_name: keeltrader-agent-platform-worker
    restart: unless-stopped
    mem_limit: 256m
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:noexec,size=50M
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - TUSHARE_DATABASE_URL=${TUSHARE_DATABASE_URL}
      - REPORT_KB_URL=${REPORT_KB_URL}
      - REPORT_KB_SERVICE_KEY=${REPORT_KB_SERVICE_KEY}
      - REDIS_URL=${REDIS_URL}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - AGENT_MANAGED_PROVIDER=${AGENT_MANAGED_PROVIDER:-openai}
      - AGENT_MANAGED_MODEL=${AGENT_MANAGED_MODEL:-}
      - AGENT_MANAGED_BASE_URL=${AGENT_MANAGED_BASE_URL:-}
      - AGENT_MANAGED_API_KEY=${AGENT_MANAGED_API_KEY:-}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - ENVIRONMENT=production
      - DATABASE_POOL_SIZE=4
      - DATABASE_MAX_OVERFLOW=1
      - DATABASE_APPLICATION_NAME=keeltrader-agent-worker
    depends_on:
      api:
        condition: service_started
    command: python tasks/agent_platform_worker.py

volumes:
  uploads_data:

networks:
  default:
    external: true
    name: services
