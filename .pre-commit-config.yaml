repos:
  - repo: local
    hooks:
      - id: diff-check
        name: git diff whitespace check
        entry: git diff --check --cached
        language: system
        pass_filenames: false

      - id: shell-syntax
        name: shell syntax check
        entry: bash -c 'for f in "$@"; do bash -n "$f"; done' --
        language: system
        files: ^keeltrader/.*\.sh$

      - id: security-defaults
        name: reject hardcoded development default passwords
        entry: bash -c 'cd keeltrader && make check-security-defaults'
        language: system
        pass_filenames: false
